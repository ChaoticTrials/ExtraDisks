plugins {
    id 'org.moddingx.modgradle.meta' version '5.1.2'
}

repositories {
    maven {
        url = 'https://maven.creeperhost.net'
        content {
            includeGroup("com.refinedmods.refinedstorage")
        }
    }
    mavenLocal()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'EMI'
        url = 'https://maven.terraformersmc.com/'
    }
}

var dev = System.getenv('IS_DEV')?.toBoolean() ?: false
var releaseType = 'beta'
var baseVersion = '26.1'
var jeiVersion = '29.5.0.26'
var mekanismVersion = '1.21.1-10.7.7.64'
var rsmekanismVersion = '1.1.0'
var rsVersion = '3.0.0-beta.1'

mod.configure {
    modid 'extradisks'
    group 'de.melanx'
    versioning {
        if (dev) {
            def gitCommitHash = ['git', 'rev-parse', 'HEAD'].execute().text.trim()
            constant baseVersion + (gitCommitHash ? "-${gitCommitHash}" : '')
        } else {
            base baseVersion
            maven 'https://maven.melanx.de/release'
        }
    }

    neoforge project.hasProperty('neo_version') ? project.neo_version : "${baseVersion}.2.7-beta"

    license 'The Apache License, Version 2.0'
    github 'ChaoticTrials/ExtraDisks'

    artifacts {
        sources {
            publishToRepositories()
        }
    }

    changelog {
        def lines = defaultChangelog.toString().split('\n')
        def filteredChangelog = lines.findAll { !it.startsWith('- [[meta]') }.join('\n')

        return filteredChangelog
    }


    publishing {
        maven {
            name 'melanx'
            url 'https://maven.melanx.de/release'
            credentials(PasswordCredentials)
        }
    }

    upload {
        all {
            type releaseType
            version '26.1.2'
            require 'refined-storage'
//            optional 'refined-storage-mekanism-integration' todo Mekanism
        }
        curseforge {
            projectId 351491
        }
        modrinth {
            projectId 'Tlo2tahX'
        }
    }
}

dependencies {
    implementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rsVersion}"

//    implementation "com.refinedmods.refinedstorage:refinedstorage-mekanism-integration:${rsmekanismVersion}"

//    compileOnlyApi("mekanism:Mekanism:${mekanismVersion}:api")

//    compileOnly "mekanism:Mekanism:${mekanismVersion}:all"
    runtimeOnly "mezz.jei:jei-${baseVersion}.2-neoforge:${jeiVersion}"
}
